name: Reproducibility checks

on:
  push:
    paths:
      - 'code/**'
      - 'data/**'
      - '.github/workflows/reproducibility.yml'
  pull_request:
    paths:
      - 'code/**'
      - 'data/**'
      - '.github/workflows/reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Validate diagnostic pipeline (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/requirements-revision.txt
      - name: Install diagnostic dependencies
        run: python -m pip install -r code/requirements-revision.txt
      - name: Compile and test
        run: |
          python -m compileall -q code/revision_experiments.py code/test_revision_sensitivity.py
          python -m unittest discover -s code -p 'test_*.py' -v
      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          checked = {'Impact_FossilFuel.ipynb', 'Price_Prediction.ipynb', 'Prediction_Inflation.ipynb'}
          for path in sorted(Path('code').glob('*.ipynb')):
              with path.open(encoding='utf-8') as handle:
                  data = json.load(handle)
              assert data.get('nbformat') == 4, path
              assert isinstance(data.get('cells'), list), path
              if path.name in checked:
                  for cell in data['cells']:
                      if cell.get('cell_type') == 'code':
                          source = cell['source']
                          ast.parse(''.join(source) if isinstance(source, list) else source)
              print(f'{path}: {len(data["cells"])} cells')
          PY
      - name: Regenerate diagnostics in CI checkout
        run: python code/revision_experiments.py
      - name: Check expected data products
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('data/revision_results')
          names = [
              'input_cleaning_report.csv',
              'stage1_existing_accuracy_metrics.csv',
              'stage1_strict_oil_baseline_metrics.csv',
              'stage1_strict_oil_baseline_forecasts.csv',
              'stage3_holdout_metrics.csv',
              'stage3_rolling_metrics.csv',
              'stage3_price_elasticities.csv',
              'transmission_granger_diagnostics.csv',
              'REVISION_EXPERIMENT_SUMMARY.md',
          ]
          for name in names:
              p = out / name
              assert p.is_file() and p.stat().st_size, p
              print(f'{p}: {p.stat().st_size} bytes')
          PY
      - name: Save diagnostic results for review
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-regeneration
          path: |
            data/revision_cleaned/
            data/revision_results/
          retention-days: 14
